services:
  - type: web
    name: growthpilot-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false          # You will paste this in Render dashboard
      - key: FRONTEND_URL
        sync: false          # You will paste your Vercel URL here
